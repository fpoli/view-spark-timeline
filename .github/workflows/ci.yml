name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.5'
          - '3.6'
          - '3.7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      - run: mkdir out
      - run: view-spark-timeline -i examples/application_1472176676028_407508_1 -o out/application_1472176676028_407508_1.svg --time-uncertainty 100
      - run: view-spark-timeline -i examples/application_1472176676028_544163_1 -o out/application_1472176676028_544163_1.svg --time-uncertainty 100
      - run: view-spark-timeline -i examples/application_1472176676028_544172_1 -o out/application_1472176676028_544172_1.svg --time-uncertainty 100
      - run: view-spark-timeline -i examples/application_1472176676028_544282_1 -o out/application_1472176676028_544282_1.svg --time-uncertainty 100
      - run: view-spark-timeline -i examples/application_1472176676028_544292_1 -o out/application_1472176676028_544292_1.svg --time-uncertainty 100
      - run: view-spark-timeline -i examples/application_1472176676028_550039_1 -o out/application_1472176676028_550039_1.svg --time-uncertainty 100
      - run: view-spark-timeline -i examples/application_1472176676028_555209_1 -o out/application_1472176676028_555209_1.svg --time-uncertainty 1000
      - run: view-spark-timeline -i examples/application_1472176676028_555221_1 -o out/application_1472176676028_555221_1.svg --time-uncertainty 1000
      - run: view-spark-timeline -i examples/application_1472176676028_555247_1 -o out/application_1472176676028_555247_1.svg --time-uncertainty 500
      - run: view-spark-timeline -i examples/application_1472176676028_555248_1 -o out/application_1472176676028_555248_1.svg --time-uncertainty 100